comparison:
  selected_dataset_variant: V2_SQRT_BALANCED_RAW
  selected_episode_ids_sha256: 73ed0d3b0c5e73c745c0aa2e81517ce1fa40240c75f9eb040d65b6876ba08239
  dataset_bridge: lerobot_streaming
  streaming_contract: /content/drive/MyDrive/parc2026-cache/openvla-streaming-selected-v1/streaming_bridge_contract.json
  full_rlds_materialization: false
  sample_budget: 4800
  train_loop_sec: 1800
  keep_equal_data_and_equal_wall_time_separate: true
notes:
  - Frozen source revision and base checkpoint match experiments/model_registry_v1.json.
  - Do not substitute upstream modified_libero_rlds; use the validated exact selected-pool streaming bridge.
  - Native finetune max_steps counts gradient steps, so M3 stopping is controlled by actual sample visits and train-loop wall time in the wrapper.
  - A training-facing iterable wrapper must add the leading window dimension expected by RLDSBatchTransform.
  - Benchmark execution remains blocked until the A100 batch/forward-backward smoke passes.
