training_entry: vla-scripts/finetune.py
base_checkpoint: openvla/openvla-7b
training:
  method: lora
  dtype: bfloat16
  lora_r: 32
  lora_dropout: 0.0
  learning_rate: 5.0e-4
  use_l1_regression: true
  upstream_default_batch_size: 8
  benchmark_batch_size: PROBE_ON_A100
