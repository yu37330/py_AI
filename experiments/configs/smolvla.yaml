id: smolvla_m3_candidate
family: smolvla
framework: lerobot
source_repo: https://github.com/huggingface/lerobot.git
source_ref: 3f2c29ef7e44b1ddccbcda3b6a63939e53639e9e
training_entry: src/lerobot/scripts/lerobot_train.py
base_checkpoint: lerobot/smolvla_base
training:
  method: candidate_native_lerobot_training
  dtype: bfloat16
  optimizer_lr: 1.0e-4
  chunk_size: 50
  n_action_steps: 50
  upstream_train_pipeline_default_batch_size: 8
  benchmark_batch_size: PROBE_ON_A100
  gradient_accumulation: PROBE_ON_A100
  stop_controller: experiments/plans/model_benchmark_runner_v1.json
  seed: 1000
comparison:
  selected_dataset_variant: V2_SQRT_BALANCED_RAW
  selected_episode_ids_sha256: 73ed0d3b0c5e73c745c0aa2e81517ce1fa40240c75f9eb040d65b6876ba08239
  sample_budget: 4800
  train_loop_sec: 1800
  keep_equal_data_and_equal_wall_time_separate: true
notes:
  - Frozen source revision matches experiments/model_registry_v1.json.
  - Use DatasetConfig.episodes from the fixed group-aware manifest; do not reselect D10.
  - Upstream LeRobot steps count micro-batches, so M3 stopping is controlled by actual sample visits and train-loop wall time.
  - Benchmark execution remains blocked until the A100 batch/forward-backward smoke passes.
